name: Verify GothUI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gothui-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prove the selected compiler can build the module; do not silently upgrade it.
  GOTOOLCHAIN: local

jobs:
  verify:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: ['1.26.0', '1.27.3']
    steps:
      - name: Check out exact source and version history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Download module dependencies
        run: go mod download
      - name: Verify downloaded modules
        run: go mod verify
      - name: Check API, formatting, dependencies, size, race tests and vet
        run: go run ./cmd/gothui-dev check
      - name: Install pinned templ generator
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1100
      - name: Compare generated source
        run: go run ./cmd/gothui-dev generated
      - name: Compile all standalone catalog recipes
        run: go run ./cmd/gothui-dev recipes
      - name: Build and run native version smoke check
        run: go run ./cmd/gothui-dev build
      - name: Retain bounded verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-go${{ matrix.go }}-${{ github.sha }}
          path: tests/results/validation/
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Known vulnerabilities / Go 1.27.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select patched Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Download and verify module dependencies
        run: |
          go mod download
          go mod verify
      - name: Scan reachable code with pinned govulncheck
        shell: bash
        run: |
          mkdir -p tests/results/security
          git rev-parse HEAD > tests/results/security/revision.txt
          go version > tests/results/security/toolchain.txt
          go env GOOS GOARCH GOTOOLCHAIN > tests/results/security/target.txt
          # Text mode returns failure for reachable findings. JSON mode does not.
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./... > tests/results/security/govulncheck.log 2>&1
      - name: Retain bounded security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-go1.27.3-${{ github.sha }}
          path: tests/results/security/
          retention-days: 7
          if-no-files-found: warn
